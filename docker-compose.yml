version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: smartcart-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcart-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=sqlite:///./smartcart.db
      - FRONTEND_URL=http://localhost:3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
    depends_on:
      - qdrant
    volumes:
      - ./backend/smartcart.db:/app/smartcart.db

volumes:
  qdrant_storage:
