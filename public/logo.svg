<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b382f"/>
      <stop offset="50%" stop-color="#145d4f"/>
      <stop offset="100%" stop-color="#1b7d6a"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="url(#logoBg)"/>
    <rect x="1" y="1" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    
    <!-- Cart Lines -->
    <g transform="translate(2, 1)">
      <path d="M12 18h5.5l4.8 19.5c.4 1.8 1.9 3.2 3.8 3.2h17.5c1.8 0 3.3-1.3 3.6-3.1L50 23.5c.3-1.1-.6-1.9-1.8-1.9H21"
            fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="26" cy="47" r="3" fill="#ffffff"/>
      <circle cx="41" cy="47" r="3" fill="#ffffff"/>
      <path d="M35 13c0 7-5.5 10-5.5 10s5.5 3 5.5 10c0-7 5.5-10 5.5-10s-5.5-3-5.5-10z" fill="url(#sparkle)"/>
      <circle cx="35" cy="23" r="1" fill="#ffffff"/>
      <path d="M45 12c0 2.5-2 3.7-2 3.7s2 1.2 2 3.7c0-2.5 2-3.7 2-3.7s-2-1.2-2-3.7z" fill="url(#gold)"/>
    </g>
  </g>

  <!-- Text: SmartCart -->
  <text x="86" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#17202b" letter-spacing="-0.8px">SmartCart</text>

  <!-- AI Badge -->
  <rect x="238" y="27" width="34" height="24" rx="6" fill="#e7f2ef"/>
  <text x="246" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#176b5b" letter-spacing="0.5px">AI</text>
</svg>
