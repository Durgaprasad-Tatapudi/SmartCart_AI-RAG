<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b382f"/>
      <stop offset="45%" stop-color="#145d4f"/>
      <stop offset="100%" stop-color="#1b7d6a"/>
    </linearGradient>

    <!-- Cart Stroke Gradient -->
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2f5ee"/>
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="aiSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Golden Accent Sparkle -->
    <linearGradient id="goldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with slight border glow -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Subtle ambient inner glow ring -->
  <circle cx="280" cy="220" r="140" fill="url(#aiSparkleGrad)" opacity="0.12" filter="blur(30px)"/>

  <!-- Main Smart Shopping Cart Element -->
  <g transform="translate(10, 4)">
    <!-- Cart Handle & Basket Structure -->
    <path d="M108 148 H152 L196 322 C200 338 214 348 230 348 H372 C388 348 401 337 405 322 L432 198 C434 188 426 180 416 180 H178"
          fill="none"
          stroke="url(#cartGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Cart Basket Grid Line -->
    <path d="M190 236 H416"
          fill="none"
          stroke="rgba(255, 255, 255, 0.45)"
          stroke-width="16"
          stroke-linecap="round"/>

    <!-- Cart Wheels -->
    <circle cx="240" cy="406" r="24" fill="#ffffff"/>
    <circle cx="240" cy="406" r="10" fill="#145d4f"/>
    <circle cx="366" cy="406" r="24" fill="#ffffff"/>
    <circle cx="366" cy="406" r="10" fill="#145d4f"/>

    <!-- Large AI Sparkle Core Floating in Cart -->
    <path d="M305 106 C305 168 250 198 250 198 C250 198 305 228 305 290 C305 228 360 198 360 198 C360 198 305 168 305 106 Z"
          fill="url(#aiSparkleGrad)"
          filter="url(#glowEffect)"/>

    <!-- AI Sparkle Core Highlight Dot -->
    <circle cx="305" cy="198" r="6" fill="#ffffff"/>

    <!-- Small Secondary Sparkle Top-Right -->
    <path d="M394 102 C394 126 374 138 374 138 C374 138 394 150 394 174 C394 150 414 138 414 138 C414 138 394 126 394 102 Z"
          fill="url(#goldSparkle)"/>
  </g>
</svg>